<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="app/app.css" />
    <title>Media Diary</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1 class="header-title">📓 Media Diary</h1>
        <div class="header-stats" id="header-stats"></div>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-category="all">All</button>
        <button class="tab" data-category="watched">🎬 Watched</button>
        <button class="tab" data-category="read">📚 Read</button>
        <button class="tab" data-category="listened">🎵 Listened</button>
      </nav>

      <div class="add-bar">
        <button class="add-btn" id="add-btn">+ Add Entry</button>
      </div>

      <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal" id="entry-modal">
          <div class="modal-header">
            <h2 class="modal-title" id="modal-title">New Entry</h2>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
          <form class="entry-form" id="entry-form">
            <div class="form-group">
              <label class="form-label">Category</label>
              <div class="category-select" id="category-select">
                <button type="button" class="cat-btn active" data-cat="watched">🎬 Watched</button>
                <button type="button" class="cat-btn" data-cat="read">📚 Read</button>
                <button type="button" class="cat-btn" data-cat="listened">🎵 Listened</button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="entry-type">Type</label>
              <select class="form-input" id="entry-type">
                <option value="tv">TV Show</option>
                <option value="movie">Movie</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="entry-title">Title</label>
              <input type="text" class="form-input" id="entry-title" placeholder="What did you consume?" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="entry-date">Date</label>
              <input type="date" class="form-input" id="entry-date" required />
            </div>

            <div class="form-group">
              <label class="form-label">Rating</label>
              <div class="rating-input" id="rating-input">
                <div class="rating-slider-wrap">
                  <input type="range" min="1" max="10" value="7" class="rating-slider" id="rating-slider" />
                  <span class="rating-value" id="rating-value">7</span>
                  <span class="rating-max">/ 10</span>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="entry-comments">Comments</label>
              <textarea class="form-input form-textarea" id="entry-comments" placeholder="Any thoughts?" rows="3"></textarea>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-cancel" id="btn-cancel">Cancel</button>
              <button type="submit" class="btn btn-save" id="btn-save">Save Entry</button>
            </div>
          </form>
        </div>
      </div>

      <div class="entries-list" id="entries-list">
        <div class="loading" id="loading">Loading your diary...</div>
      </div>

      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">📝</div>
        <p class="empty-text">No entries yet</p>
        <p class="empty-hint">Start tracking your media by adding your first entry!</p>
      </div>
    </div>
    <script type="module" src="app/app.ts"></script>
  </body>
</html>
