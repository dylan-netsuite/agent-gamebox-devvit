<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrossWorld</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="splash">
    <img
      class="splash-art"
      src="garden.svg"
      alt="An illustrated garden with a little gardener and a glass greenhouse."
    />
    <main>
      <p class="eyebrow">CROSSWORLD · A LIVING POSTCARD</p>
      <h1>Chatterbloom<br /><em>Gardens</em></h1>
      <p>Plant a word. Give it a clue.<br />See what blossoms.</p>
      <button id="play" class="primary" type="button">
        Step into the garden ↗
      </button>
      <p class="muted">One playable discovery · Saved on Reddit</p>
      <p id="launch-error" role="alert"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
