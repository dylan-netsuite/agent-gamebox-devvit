<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrossWorld</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="splash">
    <img
      class="splash-art"
      src="garden.svg"
      alt="A simple illustrated garden with a winding path, fountain, crooked gate and glasshouse."
    />
    <main>
      <p class="eyebrow">CROSSWORLD · THE FIRST WORLD</p>
      <h1>Chatterbloom<br /><em>Gardens</em></h1>
      <p>
        The paths wander. The flowers have opinions.<br />And there’s a
        word-shaped space waiting for you.
      </p>
      <button id="play" class="primary" type="button">
        Step into the garden ↗
      </button>
      <p class="muted">One playable discovery · Saved on Reddit</p>
      <p id="launch-error" role="alert"></p>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
