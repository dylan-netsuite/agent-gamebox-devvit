<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CrossWorld">
  <title>CrossWorld</title>
  <!--
    Primary mark. Use at 96px and above.
    CROSS reads across row 3, WORLD reads down column 2, crossing at the shared R.
    The open arc is the unfinished route and also reads as a C.
    Letters depend on Georgia (the app's display font token). Outline the type
    before using this anywhere Georgia is not guaranteed.
  -->
  <g fill="none" stroke="#263F3B" stroke-width="5" stroke-linecap="butt">
    <path d="M 202.57 216.86 A 116 116 0 1 1 216.86 53.43" />
  </g>

  <g stroke="#263F3B" stroke-width="2">
    <rect x="73" y="35" width="34" height="34" rx="5" fill="#F4F0E6" />
    <circle cx="90" cy="90" r="17" fill="#F4F0E6" />
    <rect x="111" y="73" width="34" height="34" rx="5" fill="#263F3B" />
    <rect x="35" y="111" width="34" height="34" rx="5" fill="#F4F0E6" />
    <rect x="73" y="111" width="34" height="34" rx="5" fill="#A75432" />
    <circle cx="128" cy="128" r="17" fill="#F4F0E6" />
    <rect x="149" y="111" width="34" height="34" rx="5" fill="#F4F0E6" />
    <rect x="187" y="111" width="34" height="34" rx="5" fill="#F4F0E6" />
    <rect x="35" y="149" width="34" height="34" rx="5" fill="#263F3B" />
    <rect x="73" y="149" width="34" height="34" rx="5" fill="#F4F0E6" />
    <rect x="73" y="187" width="34" height="34" rx="5" fill="#F4F0E6" />
  </g>

  <g stroke="#263F3B" stroke-width="2">
    <rect x="46.43" y="209.86" width="14" height="14" rx="2" fill="#F4F0E6" />
    <rect x="77.55" y="13.43" width="14" height="14" rx="2" fill="#F4F0E6" />
    <rect x="209.86" y="46.43" width="14" height="14" rx="2" fill="#A75432" />
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" text-anchor="middle" fill="#263F3B">
    <text x="90" y="59.7">W</text>
    <text x="90" y="97.7">O</text>
    <text x="52" y="135.7">C</text>
    <text x="90" y="135.7" fill="#FAF5E5">R</text>
    <text x="128" y="135.7">O</text>
    <text x="166" y="135.7">S</text>
    <text x="204" y="135.7">S</text>
    <text x="90" y="173.7">L</text>
    <text x="90" y="211.7">D</text>
  </g>
</svg>
