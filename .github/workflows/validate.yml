name: Validate games

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game:
          [
            phaser/blokus,
            phaser/dino-run,
            phaser/diplomacy,
            phaser/jeopardy,
            phaser/meerca-chase,
            phaser/mini-golf,
            phaser/rush-hour,
            phaser/scattergories,
            phaser/worms,
            web/crossworld,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: games/${{ matrix.game }}/package-lock.json
      - run: node tools/validate-all.mjs --install ${{ matrix.game }}
